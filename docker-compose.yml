version: '3.8'

services:
  ai-engine:
    build: 
      context: ./ai
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
    restart: always

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_AI_SERVICE_URL=http://localhost:3001
    depends_on:
      - ai-engine
    restart: always
